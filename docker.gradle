def podmanComposePath = System.getenv('PODMAN_COMPOSE_PATH') ?: 'podman-compose'

tasks.register('podmanUpAll', Exec) {
    dependsOn subprojects.collect { ":${it.name}:bootJar" }
    commandLine podmanComposePath, 'up', '--build', '--detach'
}

tasks.register('podmanDownAll', Exec) {
    commandLine podmanComposePath, 'down'
}
