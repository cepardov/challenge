tasks.register('podmanUpAll') {
    dependsOn subprojects.collect { ":${it.name}:podmanUp" }
}

tasks.register('podmanDownAll') {
    dependsOn subprojects.collect { ":${it.name}:podmanDown" }
}

subprojects {

    tasks.register('podmanUp', Exec) {
        dependsOn bootJar
        workingDir "${project.projectDir}"
        commandLine 'pwd'
        //commandLine 'podman-compose', 'up', '--build', '--detach'
    }

    tasks.register('podmanDown', Exec) {
        workingDir "${project.projectDir}"
        commandLine 'pwd'
        //commandLine 'podman-compose', 'down'
    }
}