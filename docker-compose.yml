version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", ""]
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - infra-network

  mariadb:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: admin
      MARIADB_DATABASE: products_db
    networks:
      - infra-network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    networks:
      - infra-network

  ms-configserver:
    build:
      context: ./ms-configserver
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - infra-network

  ms-products:
    build:
      context: ./ms-products
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    networks:
      - infra-network
    depends_on:
      - ms-configserver

  ms-inventory:
    build:
      context: ./ms-inventory
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    networks:
      - infra-network
    depends_on:
      - ms-configserver

networks:
  infra-network:
    driver: bridge